<!DOCTYPE html>
<html lang="en">
<head>
    <title>Golden Gate Bridge Voxel Simulation</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; background-color: #000; color: #fff; font-family: Monospace; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display:block;
        }
        .ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
        }
        .slider-container {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 120px;
        }
        input[type="range"] {
            width: 200px;
        }
    </style>
</head>
<body>
    <div id="info">Golden Gate Bridge Voxel Simulation</div>
    <div class="ui">
        <div class="slider-container">
            <label for="timeOfDay">Time of Day</label>
            <input type="range" id="timeOfDay" min="0" max="24" value="12" step="0.1">
        </div>
        <div class="slider-container">
            <label for="fogDensity">Fog Density</label>
            <input type="range" id="fogDensity" min="0" max="100" value="10" step="1">
        </div>
        <div class="slider-container">
            <label for="trafficDensity">Traffic Density</label>
            <input type="range" id="trafficDensity" min="0" max="100" value="50" step="1">
        </div>
        <div class="slider-container">
            <label for="zoom">Camera Zoom</label>
            <input type="range" id="zoom" min="1" max="10" value="5" step="0.1">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { ACESFilmicToneMappingShader } from 'three/addons/shaders/ACESFilmicToneMappingShader.js';

        let scene, camera, renderer, controls, composer;
        let bloomPass;
        let sun, ambientLight, sky;
        let fogParticles;
        let water;
        let traffic;
        const MAX_CARS = 400;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(150, 100, 250);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);

            // Lighting
            sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(0, 1, 0);
            scene.add(sun);

            ambientLight = new THREE.AmbientLight(0x404040, 1);
            scene.add(ambientLight);

            // Sky
            const skyGeo = new THREE.SphereGeometry(5000, 32, 32);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0x87ceeb, side: THREE.BackSide });
            sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);
            
            // Fog
            scene.fog = new THREE.FogExp2(0xaaaaaa, 0.001);
            createFogParticles();
            
            // Water
            createWater();

            // Bridge
            createBridge();

            // Terrain
            createTerrain();

            // City
            createCity();

            // Traffic
            createTraffic();


            // Post-processing
            const renderScene = new RenderPass(scene, camera);
            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.5, 0.0);
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // UI Listeners
            document.getElementById('timeOfDay').addEventListener('input', (event) => {
                updateLighting(parseFloat(event.target.value));
            });
            document.getElementById('fogDensity').addEventListener('input', (event) => {
                updateFog(parseFloat(event.target.value));
            });
            document.getElementById('trafficDensity').addEventListener('input', (event) => {
                updateTrafficDensity(parseFloat(event.target.value));
            });


            updateLighting(12);
            updateFog(10);
            updateTrafficDensity(50);
            animate();
        }

        function createTerrain() {
            const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.2, roughness: 0.8 });
            const terrainGeometry = new THREE.PlaneGeometry(1000, 1000, 128, 128);
            
            const marinHeadlands = new THREE.Mesh(terrainGeometry.clone(), terrainMaterial);
            marinHeadlands.rotation.x = -Math.PI / 2;
            marinHeadlands.position.set(-800, 0, 0);
            scene.add(marinHeadlands);

            const sfPeninsula = new THREE.Mesh(terrainGeometry.clone(), terrainMaterial);
            sfPeninsula.rotation.x = -Math.PI / 2;
            sfPeninsula.position.set(800, 0, 0);
            scene.add(sfPeninsula);
        }

        function createCity() {
            const buildingMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5, roughness: 0.7 });
            const buildingGeometry = new THREE.BoxGeometry(1, 1, 1);

            for (let i = 0; i < 100; i++) {
                const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
                const x = Math.random() * 800 + 400;
                const z = Math.random() * 1000 - 500;
                const height = Math.random() * 200 + 50;
                building.position.set(x, height / 2, z);
                building.scale.set(Math.random() * 50 + 20, height, Math.random() * 50 + 20);
                scene.add(building);
            }
        }

        function createTraffic() {
            const carGeometry = new THREE.BoxGeometry(4, 2, 2);
            const carMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.5 });
            traffic = new THREE.InstancedMesh(carGeometry, carMaterial, MAX_CARS);
            scene.add(traffic);

            const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 });
            const taillightMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1 });
            const lightGeometry = new THREE.PlaneGeometry(0.5, 0.2);

            for (let i = 0; i < MAX_CARS; i++) {
                const headlight1 = new THREE.Mesh(lightGeometry, headlightMaterial);
                headlight1.position.set(2, 0.5, 0.7);
                const headlight2 = new THREE.Mesh(lightGeometry, headlightMaterial);
                headlight2.position.set(2, 0.5, -0.7);
                
                const taillight1 = new THREE.Mesh(lightGeometry, taillightMaterial);
                taillight1.position.set(-2, 0.5, 0.7);
                const taillight2 = new THREE.Mesh(lightGeometry, taillightMaterial);
                taillight2.position.set(-2, 0.5, -0.7);

                const car = new THREE.Object3D();
                car.add(headlight1, headlight2, taillight1, taillight2);
                car.userData.speed = Math.random() * 0.5 + 0.5;
                const z = (i % 2 === 0 ? 5 : -5);
                car.position.set(Math.random() * 600 - 300, 53.5, z);
                traffic.add(car);
            }
        }

        function updateTrafficDensity(density) {
            traffic.count = Math.floor(MAX_CARS * (density / 100));
        }

        function updateTraffic(time) {
            for (let i = 0; i < traffic.count; i++) {
                const car = traffic.children[i];
                car.position.x += car.userData.speed;
                if (car.position.x > 300) {
                    car.position.x = -300;
                }
                
                const matrix = new THREE.Matrix4();
                matrix.setPosition(car.position.x, 53.5, car.position.z);
                traffic.setMatrixAt(i, matrix);
            }
            traffic.instanceMatrix.needsUpdate = true;
        }

        function createBridge() {
            const bridgeMaterial = new THREE.MeshStandardMaterial({ color: 0xc44242, metalness: 0.8, roughness: 0.5 });

            // Towers
            const towerGeometry = new THREE.BoxGeometry(20, 220, 10);
            const tower1 = new THREE.Mesh(towerGeometry, bridgeMaterial);
            tower1.position.set(-200, 110, 0);
            scene.add(tower1);

            const tower2 = new THREE.Mesh(towerGeometry, bridgeMaterial);
            tower2.position.set(200, 110, 0);
            scene.add(tower2);

            // Deck
            const deckGeometry = new THREE.BoxGeometry(600, 5, 30);
            const deck = new THREE.Mesh(deckGeometry, bridgeMaterial);
            deck.position.set(0, 50, 0);
            scene.add(deck);

            // Catenary Cables
            const catenaryCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-250, 60, 10),
                new THREE.Vector3(-200, 180, 10),
                new THREE.Vector3(0, 40, 10),
                new THREE.Vector3(200, 180, 10),
                new THREE.Vector3(250, 60, 10)
            ]);
            const catenaryGeometry = new THREE.TubeGeometry(catenaryCurve, 100, 2, 8, false);
            const catenaryCable1 = new THREE.Mesh(catenaryGeometry, bridgeMaterial);
            scene.add(catenaryCable1);
            
            const catenaryCable2 = new THREE.Mesh(catenaryGeometry.clone(), bridgeMaterial);
            catenaryCable2.position.z = -20;
            scene.add(catenaryCable2);

            // Suspender Cables
            for (let i = -250; i < 250; i+= 20) {
                const suspenderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 8);
                const suspender1 = new THREE.Mesh(suspenderGeometry, bridgeMaterial);
                const suspender2 = new THREE.Mesh(suspenderGeometry, bridgeMaterial);
                
                const p1 = catenaryCurve.getPointAt( (i + 250) / 500);
                suspender1.position.set(i, (p1.y + 50) / 2, 10);
                suspender1.scale.y = p1.y - 50;

                suspender2.position.set(i, (p1.y + 50) / 2, -10);
                suspender2.scale.y = p1.y - 50;

                scene.add(suspender1);
                scene.add(suspender2);
            }
        }

        function createWater() {
            const waterGeometry = new THREE.PlaneGeometry(10000, 10000, 512, 512);
            const waterMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 1.0 },
                    sunDirection: { value: new THREE.Vector3() },
                    sunColor: { value: new THREE.Color(0xffffff) },
                    waterColor: { value: new THREE.Color(0x001e0f) },
                    fogColor: { value: new THREE.Color(0xaaaaaa) },
                    fogDensity: { value: 0.001 },
                },
                vertexShader: `
                    uniform float time;
                    varying vec3 vWorldPosition;

                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        float waveHeight = 5.0 * sin(worldPosition.x * 0.01 + time) * cos(worldPosition.z * 0.01 + time);
                        worldPosition.y += waveHeight;
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 sunDirection;
                    uniform vec3 sunColor;
                    uniform vec3 waterColor;
                    uniform vec3 fogColor;
                    uniform float fogDensity;

                    varying vec3 vWorldPosition;

                    void main() {
                        vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
                        vec3 normal = normalize(vec3(
                            -5.0 * 0.01 * cos(vWorldPosition.x * 0.01 + gl_FragCoord.w),
                            1.0,
                            -5.0 * 0.01 * sin(vWorldPosition.z * 0.01 + gl_FragCoord.w)
                        ));
                        
                        // Specular reflection
                        vec3 reflectDirection = reflect(-sunDirection, normal);
                        float specular = max(0.0, dot(viewDirection, reflectDirection));
                        specular = pow(specular, 32.0);
                        
                        // Fresnel effect
                        float fresnel = 0.02 + 0.98 * pow(1.0 - dot(viewDirection, normal), 5.0);
                        
                        vec3 color = mix(waterColor, sunColor, specular * fresnel);

                        // Fog
                        float fogDistance = length(cameraPosition - vWorldPosition);
                        float fogFactor = 1.0 - exp(-fogDensity * fogDensity * fogDistance * fogDistance);
                        
                        gl_FragColor = vec4(mix(color, fogColor, fogFactor), 1.0);
                    }
                `
            });
            water = new THREE.Mesh(waterGeometry, waterMaterial);
            water.rotation.x = -Math.PI / 2;
            scene.add(water);
        }

        function createFogParticles() {
            const particleCount = 5000;
            const vertices = [];
            for (let i = 0; i < particleCount; i++) {
                const x = Math.random() * 2000 - 1000;
                const y = Math.random() * 200 - 50;
                const z = Math.random() * 2000 - 1000;
                vertices.push(x, y, z);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 20,
                map: createFogTexture(),
                transparent: true,
                opacity: 0.1,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            fogParticles = new THREE.Points(geometry, material);
            scene.add(fogParticles);
        }

        function createFogTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }
        
        function updateFog(density) {
            scene.fog.density = density / 10000;
            if (water) {
                water.material.uniforms.fogDensity.value = density / 10000;
            }
            fogParticles.material.opacity = density / 1000;
        }

        function updateLighting(time) {
            const angle = (time / 24) * Math.PI * 2 - Math.PI / 2;
            sun.position.x = Math.cos(angle) * 1000;
            sun.position.y = Math.sin(angle) * 1000;
            sun.position.z = 500;

            const sunIntensity = Math.max(0, Math.sin(angle + Math.PI / 2));
            sun.intensity = sunIntensity;
            ambientLight.intensity = sunIntensity * 0.5 + 0.1;

            const skyColor = new THREE.Color().setHSL(0.6, 1, Math.max(0.1, sunIntensity));
            sky.material.color = skyColor;
            scene.background = skyColor;
            scene.fog.color = skyColor;
            if(water){
                water.material.uniforms.sunDirection.value.copy(sun.position).normalize();
                water.material.uniforms.sunColor.value.copy(sun.color);
                water.material.uniforms.fogColor.value.copy(skyColor);
            }

            const isNight = sunIntensity < 0.1;
            if (traffic) {
                for (let i = 0; i < traffic.count; i++) {
                    const car = traffic.children[i];
                    car.children[0].visible = isNight; // Headlight
                    car.children[1].visible = isNight; // Headlight
                    car.children[2].visible = isNight; // Taillight
                    car.children[3].visible = isNight; // Taillight
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            fogParticles.rotation.y = time * 0.1;
            if (water) {
                water.material.uniforms.time.value = time;
            }
            if (traffic) {
                updateTraffic(time);
            }
            
            controls.update();
            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize, false);

        init();
    </script>
</body>
</html>
